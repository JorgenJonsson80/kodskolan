# Bygger appen och publicerar den på GitHub Pages vid varje push till main.
name: Publicera på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chrome till testerna som mäter layout (vitest browser mode).
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          # on låser betalbanorna (docs/TILLGANG.md).
          VITE_PAYWALL: ${{ vars.VITE_PAYWALL }}
          # Krypterar betalbanornas innehåll (scripts/content.mjs). Måste
          # finnas när VITE_PAYWALL är on, annars stoppar bygget.
          CONTENT_KEY: ${{ secrets.CONTENT_KEY }}
          # Priset för full tillgång, t.ex. 990 kr (docs/BETALNING.md).
          VITE_PRICE_TEXT: ${{ vars.VITE_PRICE_TEXT }}
          # Tomma tills sajten har en egen domän (se docs/DOMAN.md).
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_BASE: ${{ vars.VITE_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
